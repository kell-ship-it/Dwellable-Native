<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dwellable Notifications Strategy — Formation Intelligence Questions</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #f5f3f0 0%, #ede6e1 100%);
            color: #2c2c2c;
            line-height: 1.6;
            padding: 40px 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.08);
            overflow: hidden;
        }

        header {
            background: linear-gradient(135deg, #8B7355 0%, #A0826D 100%);
            color: white;
            padding: 40px;
            text-align: center;
        }

        header h1 {
            font-size: 28px;
            margin-bottom: 10px;
            font-weight: 600;
        }

        header p {
            font-size: 14px;
            opacity: 0.9;
            max-width: 600px;
            margin: 0 auto;
        }

        .progress-bar {
            height: 4px;
            background: #e0e0e0;
            margin-top: 20px;
        }

        .progress-fill {
            height: 100%;
            background: #C9B27C;
            transition: width 0.3s ease;
        }

        main {
            padding: 40px;
        }

        .question-block {
            margin-bottom: 40px;
            padding-bottom: 40px;
            border-bottom: 1px solid #e8e8e8;
        }

        .question-block:last-of-type {
            border-bottom: none;
            margin-bottom: 0;
            padding-bottom: 0;
        }

        .question-number {
            display: inline-block;
            background: #C9B27C;
            color: white;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            text-align: center;
            line-height: 32px;
            font-weight: 600;
            font-size: 14px;
            margin-right: 12px;
        }

        .question-title {
            font-size: 18px;
            font-weight: 600;
            color: #2c2c2c;
            margin-bottom: 12px;
            display: inline-block;
        }

        .question-description {
            color: #666;
            margin-bottom: 20px;
            padding: 12px 16px;
            background: #f9f7f5;
            border-left: 3px solid #C9B27C;
            border-radius: 4px;
        }

        .question-subquestions {
            background: #faf8f6;
            padding: 16px;
            border-radius: 6px;
            margin-bottom: 20px;
            font-size: 14px;
            color: #555;
        }

        .question-subquestions strong {
            display: block;
            color: #2c2c2c;
            margin-bottom: 10px;
            font-weight: 600;
        }

        .question-subquestions ul {
            margin-left: 20px;
        }

        .question-subquestions li {
            margin-bottom: 8px;
        }

        textarea {
            width: 100%;
            min-height: 120px;
            padding: 16px;
            border: 1px solid #d0d0d0;
            border-radius: 6px;
            font-family: inherit;
            font-size: 14px;
            resize: vertical;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, monospace;
        }

        textarea:focus {
            outline: none;
            border-color: #C9B27C;
            box-shadow: 0 0 0 3px rgba(201, 178, 124, 0.1);
        }

        .input-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            font-weight: 500;
            margin-bottom: 8px;
            color: #2c2c2c;
            font-size: 13px;
        }

        .footer {
            background: #f9f7f5;
            padding: 40px;
            display: flex;
            gap: 16px;
            justify-content: center;
            flex-wrap: wrap;
        }

        button {
            padding: 12px 24px;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-primary {
            background: #C9B27C;
            color: white;
        }

        .btn-primary:hover {
            background: #b89d5f;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(201, 178, 124, 0.3);
        }

        .btn-secondary {
            background: white;
            color: #2c2c2c;
            border: 1px solid #d0d0d0;
        }

        .btn-secondary:hover {
            background: #f9f7f5;
            border-color: #C9B27C;
        }

        .saved-indicator {
            color: #4CAF50;
            font-size: 12px;
            font-weight: 500;
            display: none;
            margin-top: 8px;
        }

        .saved-indicator.show {
            display: block;
            animation: fadeInOut 3s ease;
        }

        @keyframes fadeInOut {
            0% { opacity: 1; }
            80% { opacity: 1; }
            100% { opacity: 0; }
        }

        .status-bar {
            background: #f0f0f0;
            padding: 16px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            color: #666;
        }

        .completion-count {
            font-weight: 600;
            color: #2c2c2c;
        }

        @media (max-width: 600px) {
            header {
                padding: 30px 20px;
            }

            header h1 {
                font-size: 22px;
            }

            main {
                padding: 20px;
            }

            .question-block {
                margin-bottom: 30px;
                padding-bottom: 30px;
            }

            .footer {
                padding: 20px;
                flex-direction: column;
            }

            button {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Dwellable Notifications Strategy</h1>
            <p>Formation Intelligence Questions — Lock Down the Strategy</p>
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill" style="width: 0%"></div>
            </div>
        </header>

        <div class="status-bar">
            <div>
                Responses saved automatically to your browser
            </div>
            <div class="completion-count">
                <span id="completedCount">0</span> / 10 questions answered
            </div>
        </div>

        <main id="questionnaire">
            <!-- Questions will be inserted here by JavaScript -->
        </main>

        <div class="footer">
            <button class="btn-secondary" onclick="resetForm()">Clear All Responses</button>
            <button class="btn-primary" onclick="exportResponses()">Export Responses</button>
        </div>
    </div>

    <script>
        const questions = [
            {
                number: 1,
                title: "Pillar Sequencing: When Does Notifications Ship?",
                description: "Current PRD says Pillar 9 (Notifications) is 'deferred.' But P3 (Soaking) is the blocker — notifications only work if there's something compelling to return to. P6 (Search) and P7 (Formation Intelligence) provide the richest signals.",
                subquestions: [
                    "Should Pillar 9 launch <strong>after</strong> P6/P7 are complete (full Formation Intelligence signals)?",
                    "Or launch Pillar 9 with generic notifications first, then add Formation Intelligence in Phase 2+?",
                    "What's your preference? Is 'sparse and meaningful' worth waiting for?"
                ]
            },
            {
                number: 2,
                title: "Formation Intelligence Signal Availability",
                description: "Different notification types require different data: Archetype-affirming (P1), Breakthrough recognition (P4), Theme emergence (P6/P7), Rhythm recognition (P7).",
                subquestions: [
                    "Which Formation Intelligence signals are 'must-have' vs 'nice-to-have'?",
                    "If P6/P7 aren't ready, can we launch with just P1 (archetype) + P4 (mood progression)?",
                    "Or should we wait for the full Formation Intelligence system?"
                ]
            },
            {
                number: 3,
                title: "Frequency: 1-2/Month Still Feels Right?",
                description: "Current strategy: 1-2 per month (sparse). But Formation Intelligence might change this. If notifications are deeply personalized, could we do more frequent? Or should Formation Intelligence notifications be even sparser?",
                subquestions: [
                    "Does the '1-2 per month' still feel right, or should Formation Intelligence change the frequency?",
                    "Should frequency depend on archetype? (Jotter might want regular affirmation; Processor might want less frequent but deeper?)"
                ]
            },
            {
                number: 4,
                title: "What Counts as a 'Breakthrough'?",
                description: "I suggested detecting breakthroughs via mood tag progression (e.g., Conflicted → Hopeful → Peaceful). But how should we define it precisely?",
                subquestions: [
                    "How should we define 'breakthrough'? Specific mood transitions?",
                    "What's the threshold? (2-point shift? 3 points? specific sequence?)",
                    "How recent/fresh? (Past 7 days? 30 days?)",
                    "Should certain mood sequences trigger automatically, or are there false positives to avoid?"
                ]
            },
            {
                number: 5,
                title: "Segments vs Formation Intelligence: Replace or Enhance?",
                description: "Current strategy has 4 segments (New Users, Non-Soakers, Occasional Soakers, Active Dwellers). Formation Intelligence adds archetype dimension (Jotter, Venter, Processor).",
                subquestions: [
                    "Should we replace segments with Formation Intelligence signals?",
                    "Or cross them (e.g., 'Active Dweller + Jotter' is different from 'Active Dweller + Processor')?",
                    "Does an active Jotter need different notifications than an active Processor?"
                ]
            },
            {
                number: 6,
                title: "Theme Notifications: When Do They Trigger?",
                description: "Current P6/P7 strategy: detect themes at 3+ occurrences. But when should we notify?",
                subquestions: [
                    "Should we notify at 3+ occurrences, or wait until theme is 'stable' (5+ times)?",
                    "Or notify on first emergence AND again at 3+?",
                    "How recent? (Themes from past 30 days? 90 days? all-time patterns?)",
                    "Should theme notifications reference the user's own language, or more generic?"
                ]
            },
            {
                number: 7,
                title: "Copy & Tone: Fixed Templates or LLM-Generated?",
                description: "I showed template-based examples. But we could use LLM to generate personalized copy for each user.",
                subquestions: [
                    "Should notifications be templated (predictable, consistent) or LLM-generated (personalized, dynamic)?",
                    "Should tone vary by archetype? (Jotter notifications sound different from Processor?)",
                    "Who writes the initial copy — designer? LLM? You?"
                ]
            },
            {
                number: 8,
                title: "Fallback Strategy: What If Formation Intelligence Fails?",
                description: "What happens when we can't detect a theme, breakthrough, or archetype? Do we fall back to generic, stay silent, or something else?",
                subquestions: [
                    "Do we fall back to generic 'come back and dwell' notifications?",
                    "Or do we just NOT send a notification that week (better silent than wrong)?",
                    "Should users be able to correct/dismiss Formation Intelligence signals?"
                ]
            },
            {
                number: 9,
                title: "Privacy & Transparency: Show the User Our Thinking?",
                description: "Formation Intelligence notifications will say things like 'A pattern is emerging: relational moments.' But how transparent should we be about how we detected it?",
                subquestions: [
                    "Should users see that we detected a theme? ('We noticed a pattern...')?",
                    "Should we explain how we detected it? ('Based on your moods and moment frequency...')?",
                    "Or keep it opaque for simplicity?"
                ]
            },
            {
                number: 10,
                title: "Success Metrics: What Actually Matters?",
                description: "Current metrics are engagement-focused (CTR, D7 retention). Formation-aligned metrics would be different (Formation depth, user feels 'seen', spiritual discernment).",
                subquestions: [
                    "What's the primary success metric? CTR? Formation engagement? User satisfaction?",
                    "Should we measure 'users feel Formation Intelligence notifications are personally relevant' (via survey)?",
                    "How do we know if a notification actually helped the user notice a pattern?"
                ]
            }
        ];

        function initializeQuestionnaire() {
            const questionnaire = document.getElementById('questionnaire');
            questions.forEach(q => {
                const block = document.createElement('div');
                block.className = 'question-block';

                let subquestionHTML = '';
                if (q.subquestions && q.subquestions.length > 0) {
                    subquestionHTML = '<div class="question-subquestions"><strong>Questions to consider:</strong><ul>';
                    q.subquestions.forEach(sq => {
                        subquestionHTML += `<li>${sq}</li>`;
                    });
                    subquestionHTML += '</ul></div>';
                }

                block.innerHTML = `
                    <div>
                        <span class="question-number">${q.number}</span>
                        <h2 class="question-title">${q.title}</h2>
                    </div>
                    <div class="question-description">${q.description}</div>
                    ${subquestionHTML}
                    <div class="input-group">
                        <label for="q${q.number}">Your Response:</label>
                        <textarea id="q${q.number}" placeholder="Type your response here..." data-question="${q.number}"></textarea>
                        <div class="saved-indicator" id="saved${q.number}">✓ Saved</div>
                    </div>
                `;
                questionnaire.appendChild(block);

                const textarea = block.querySelector(`#q${q.number}`);
                textarea.addEventListener('input', (e) => saveResponse(q.number, e.target.value));

                // Load saved response
                const saved = localStorage.getItem(`question_${q.number}`);
                if (saved) {
                    textarea.value = saved;
                }
            });

            updateProgress();
        }

        function saveResponse(questionNumber, response) {
            localStorage.setItem(`question_${questionNumber}`, response);
            showSavedIndicator(questionNumber);
            updateProgress();
        }

        function showSavedIndicator(questionNumber) {
            const indicator = document.getElementById(`saved${questionNumber}`);
            indicator.classList.add('show');
            setTimeout(() => {
                indicator.classList.remove('show');
            }, 3000);
        }

        function updateProgress() {
            let completed = 0;
            for (let i = 1; i <= 10; i++) {
                const response = localStorage.getItem(`question_${i}`);
                if (response && response.trim().length > 0) {
                    completed++;
                }
            }

            const percentage = (completed / 10) * 100;
            document.getElementById('progressFill').style.width = percentage + '%';
            document.getElementById('completedCount').textContent = completed;
        }

        function resetForm() {
            if (confirm('Are you sure you want to clear all responses? This cannot be undone.')) {
                for (let i = 1; i <= 10; i++) {
                    localStorage.removeItem(`question_${i}`);
                    const textarea = document.getElementById(`q${i}`);
                    if (textarea) textarea.value = '';
                }
                updateProgress();
            }
        }

        function exportResponses() {
            let exportText = 'DWELLABLE NOTIFICATIONS STRATEGY\nFormation Intelligence Questions — Responses\n';
            exportText += '=' .repeat(80) + '\n\n';
            exportText += `Generated: ${new Date().toLocaleString()}\n\n`;

            let hasResponses = false;
            for (let i = 1; i <= 10; i++) {
                const response = localStorage.getItem(`question_${i}`);
                const question = questions[i - 1];

                exportText += `\n${'─'.repeat(80)}\n`;
                exportText += `QUESTION ${i}: ${question.title}\n`;
                exportText += `${'─'.repeat(80)}\n\n`;
                exportText += `Context: ${question.description}\n\n`;

                if (response && response.trim().length > 0) {
                    exportText += `Response:\n${response}\n`;
                    hasResponses = true;
                } else {
                    exportText += `[No response provided]\n`;
                }
            }

            if (!hasResponses) {
                alert('Please answer at least one question before exporting.');
                return;
            }

            exportText += `\n\n${'═'.repeat(80)}\nEnd of responses\n`;

            // Create blob and download
            const blob = new Blob([exportText], { type: 'text/plain' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `dwellable-notifications-responses-${new Date().toISOString().split('T')[0]}.txt`;
            document.body.appendChild(a);
            a.click();
            window.URL.revokeObjectURL(url);
            document.body.removeChild(a);
        }

        // Initialize on page load
        document.addEventListener('DOMContentLoaded', initializeQuestionnaire);
    </script>
</body>
</html>
