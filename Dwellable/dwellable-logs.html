<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dwellable Console Logs</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'SF Mono', Monaco, 'Courier New', monospace; background: #1e1e1e; color: #d4d4d4; padding: 16px; line-height: 1.5; }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; padding-bottom: 12px; border-bottom: 1px solid #333; }
    .title { font-size: 16px; font-weight: bold; color: #4ec9b0; }
    .controls { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    button { padding: 6px 12px; background: #007acc; color: white; border: none; border-radius: 3px; cursor: pointer; font-family: inherit; font-size: 11px; }
    button:hover { background: #005a9e; }
    button.sec { background: #3a3a3a; }
    button.sec:hover { background: #4a4a4a; }
    .source-row { display: flex; gap: 8px; align-items: center; margin-bottom: 10px; font-size: 11px; }
    .source-row label { color: #888; }
    .source-row input { background: #2d2d2d; color: #d4d4d4; border: 1px solid #444; border-radius: 3px; padding: 4px 8px; font-family: inherit; font-size: 11px; width: 280px; }
    .source-row input:focus { outline: none; border-color: #007acc; }
    .status { display: flex; gap: 16px; font-size: 11px; color: #666; margin-bottom: 10px; }
    .dot { color: #4ec9b0; }
    .dot.paused { color: #555; }
    .logs-wrap { border: 1px solid #2a2a2a; background: #181818; border-radius: 3px; }
    .logs { overflow-y: auto; padding: 10px; height: calc(100vh - 160px); }
    .entry { display: flex; gap: 10px; margin-bottom: 2px; font-size: 11px; padding: 2px 4px; border-radius: 2px; }
    .entry:hover { background: rgba(255,255,255,.04); }
    .ts { color: #555; width: 180px; flex-shrink: 0; }
    .lv { width: 68px; flex-shrink: 0; font-weight: 600; text-align: center; padding: 0 4px; border-radius: 2px; }
    .lv-ERROR   { color: #f48771; background: rgba(244,135,113,.15); }
    .lv-WARNING { color: #dcdcaa; background: rgba(220,220,170,.12); }
    .lv-SUCCESS { color: #6a9955; background: rgba(106,153,85,.12); }
    .lv-INFO    { color: #4ec9b0; background: rgba(78,201,176,.12); }
    .msg { flex-grow: 1; word-break: break-word; white-space: pre-wrap; }
    .empty { text-align: center; color: #444; padding: 50px 20px; font-size: 12px; line-height: 2; }
  </style>
</head>
<body>
  <div class="header">
    <div class="title">📱 Dwellable Console Logs</div>
    <div class="controls">
      <span class="dot" id="dot">● live</span>
      <button onclick="load()">↺ Refresh</button>
      <button class="sec" onclick="toggle()" id="pauseBtn">Pause</button>
      <button class="sec" onclick="bottom()">↓ Bottom</button>
      <button class="sec" onclick="clearView()">✕ Clear view</button>
    </div>
  </div>

  <!-- Source selector -->
  <div class="source-row">
    <label>Source URL:</label>
    <input id="srcUrl" value="dwellable-logs.json" placeholder="dwellable-logs.json  or  http://192.168.x.x:8787/logs" />
    <button onclick="saveSource()">Apply</button>
    <button class="sec" onclick="resetSource()">Reset</button>
  </div>

  <div class="status">
    <span>Entries: <strong id="cnt">0</strong></span>
    <span>Updated: <span id="ts">—</span></span>
    <span id="srcLabel" style="color:#4a4a4a">file mode</span>
  </div>

  <div class="logs-wrap">
    <div class="logs" id="logs">
      <div class="empty">
        <strong>Simulator:</strong> run app → logs appear automatically<br>
        <strong>Device:</strong> enter <code>http://[device-ip]:8787/logs</code> in Source URL above<br><br>
        Find device IP: Settings → Wi-Fi → tap your network
      </div>
    </div>
  </div>

  <script>
    // Persist source URL across reloads
    const STORAGE_KEY = 'dwellable_log_src';
    let src = localStorage.getItem(STORAGE_KEY) || 'http://169.254.94.22:8787/logs';
    document.getElementById('srcUrl').value = src;
    updateSrcLabel();

    let auto = true, prev = 0, atBottom = true;

    document.getElementById('logs').addEventListener('scroll', function() {
      atBottom = (this.scrollHeight - this.scrollTop - this.clientHeight) < 40;
    });

    function bottom() {
      const el = document.getElementById('logs');
      el.scrollTop = el.scrollHeight;
      atBottom = true;
    }

    function saveSource() {
      src = document.getElementById('srcUrl').value.trim();
      localStorage.setItem(STORAGE_KEY, src);
      updateSrcLabel();
      prev = 0;
      load();
    }

    function resetSource() {
      src = 'dwellable-logs.json';
      document.getElementById('srcUrl').value = src;
      localStorage.setItem(STORAGE_KEY, src);
      updateSrcLabel();
      prev = 0;
      load();
    }

    function updateSrcLabel() {
      document.getElementById('srcLabel').textContent =
        src.startsWith('http') ? '📡 device mode — ' + src : '💾 file mode';
    }

    async function load() {
      try {
        const url = src.startsWith('http') ? src : src + '?t=' + Date.now();
        const r = await fetch(url);
        if (!r.ok) throw new Error('HTTP ' + r.status);
        const logs = await r.json();
        if (logs.length === prev) return;
        prev = logs.length;

        const el = document.getElementById('logs');
        el.innerHTML = '';
        for (const log of logs) {
          const d = document.createElement('div');
          d.className = 'entry';
          d.innerHTML =
            '<div class="ts">' + esc(log.timestamp) + '</div>' +
            '<div class="lv lv-' + esc(log.level) + '">' + esc(log.level) + '</div>' +
            '<div class="msg">' + esc(log.message) + '</div>';
          el.appendChild(d);
        }
        if (atBottom) bottom();
        document.getElementById('cnt').textContent = logs.length;
        document.getElementById('ts').textContent = new Date().toLocaleTimeString();
      } catch (e) {
        // silently wait — don't spam the UI with fetch errors
      }
    }

    function clearView() { prev = -1; load(); }

    function toggle() {
      auto = !auto;
      document.getElementById('pauseBtn').textContent = auto ? 'Pause' : 'Resume';
      document.getElementById('dot').className = 'dot' + (auto ? '' : ' paused');
      document.getElementById('dot').textContent = auto ? '● live' : '○ paused';
    }

    function esc(s) {
      return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    load();
    setInterval(() => { if (auto) load(); }, 1000);
    document.addEventListener('visibilitychange', () => { if (!document.hidden) load(); });
  </script>
</body>
</html>
