<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dwellable Analytics Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: #0f0f0f;
            color: #ffffff;
            padding: 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
            border-bottom: 1px solid #333;
            padding-bottom: 20px;
        }

        h1 {
            font-size: 28px;
            font-weight: 600;
        }

        .controls {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        input[type="email"] {
            padding: 8px 12px;
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 6px;
            color: #fff;
            font-size: 14px;
            width: 200px;
        }

        button {
            padding: 8px 16px;
            background: #C9B27C;
            color: #1a1a1a;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            font-size: 14px;
            transition: opacity 0.2s;
        }

        button:hover {
            opacity: 0.9;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .status {
            font-size: 12px;
            color: #999;
        }

        .status.connected {
            color: #4ade80;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .stat-card {
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 10px;
            padding: 20px;
        }

        .stat-label {
            font-size: 12px;
            color: #999;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
        }

        .stat-value {
            font-size: 32px;
            font-weight: 600;
            color: #C9B27C;
        }

        .stat-detail {
            font-size: 12px;
            color: #666;
            margin-top: 8px;
        }

        .events-section {
            margin-top: 40px;
        }

        .events-section h2 {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 20px;
            border-bottom: 1px solid #333;
            padding-bottom: 10px;
        }

        .events-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-height: 500px;
            overflow-y: auto;
        }

        .event {
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 6px;
            padding: 12px;
            font-size: 13px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .event-type {
            display: inline-block;
            padding: 2px 8px;
            background: #333;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 600;
            color: #C9B27C;
            margin-right: 10px;
        }

        .event-type.moment_created {
            background: rgba(201, 178, 124, 0.2);
        }

        .event-type.app_opened {
            background: rgba(100, 150, 200, 0.2);
            color: #6496c8;
        }

        .event-moment-type {
            font-size: 11px;
            color: #999;
            padding-left: 5px;
            border-left: 1px solid #333;
            margin-left: 5px;
        }

        .event-timestamp {
            font-size: 11px;
            color: #666;
            flex-shrink: 0;
        }

        .message {
            border-radius: 6px;
            padding: 12px;
            margin-bottom: 20px;
        }

        .message.error {
            background: rgba(220, 100, 100, 0.1);
            border: 1px solid #dc6464;
            color: #dc6464;
        }

        .message.success {
            background: rgba(100, 220, 100, 0.1);
            border: 1px solid #64dc64;
            color: #64dc64;
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #666;
        }

        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: #333;
            border-radius: 3px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #555;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>📊 Dwellable Analytics</h1>
            <div class="controls">
                <input type="email" id="userEmail" placeholder="your@email.com" value="pilot2@dwellable.com">
                <button onclick="window.loadAnalytics()">Refresh</button>
                <div class="status" id="status">Disconnected</div>
                <div class="status" id="lastUpdated" style="margin-left:8px;"></div>
            </div>
        </header>

        <div id="message"></div>

        <div class="stats" id="stats">
            <div class="stat-card">
                <div class="stat-label">Total Moments</div>
                <div class="stat-value" id="totalMoments">0</div>
                <div class="stat-detail" id="momentDetail"></div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Voice Moments</div>
                <div class="stat-value" id="voiceMoments">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Text Moments</div>
                <div class="stat-value" id="textMoments">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">App Sessions</div>
                <div class="stat-value" id="sessions">0</div>
            </div>
        </div>

        <div class="events-section">
            <h2>Recent Events</h2>
            <div class="events-list" id="eventsList">
                <div class="empty-state">No events yet. Use the app to generate events.</div>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = "https://lhcjobrtmbawlhjyodxz.supabase.co";
        const SUPABASE_KEY = "YOUR_SUPABASE_ANON_KEY"; // Set your key here

        // Initialize Supabase on window object
        window.sbClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        window.loadAnalytics = async function() {
            const email = document.getElementById("userEmail").value.toLowerCase().trim();
            if (!email) {
                showMessage("Please enter your email address.", "error");
                return;
            }

            console.log("🔍 Looking up email:", email);
            showMessage("Loading...", "");

            try {
                // Fetch user ID from users table
                const { data: users, error: userError } = await window.sbClient
                    .from("users")
                    .select("id, email")
                    .eq("email", email)
                    .limit(1);

                console.log("📋 Users lookup:", { users, userError });

                if (userError) {
                    console.error("User lookup error:", userError);
                    showMessage(`Error looking up user: ${userError.message}`, "error");
                    updateStatus("Disconnected");
                    return;
                }

                if (!users || users.length === 0) {
                    showMessage(`User "${email}" not found. Check your email address.`, "error");
                    updateStatus("Disconnected");
                    return;
                }

                const userId = users[0].id;
                console.log("✅ Found user:", userId);

                // Fetch actual moments count (source of truth) — no limit
                const { data: moments, error: momentsError } = await window.sbClient
                    .from("moments")
                    .select("id")
                    .eq("user_id", userId)
                    .limit(1000);

                if (momentsError) {
                    console.error("Moments lookup error:", momentsError);
                    showMessage(`Error loading moments: ${momentsError.message}`, "error");
                    updateStatus("Disconnected");
                    return;
                }

                // Fetch usage events for voice/text breakdown and sessions — high limit for growth
                const { data: events, error: eventsError } = await window.sbClient
                    .from("usage_events")
                    .select("*")
                    .eq("user_id", userId)
                    .order("timestamp", { ascending: false })
                    .limit(500);

                console.log("📊 Moments:", moments?.length, "Events:", events?.length, eventsError);

                if (eventsError) {
                    console.error("Events lookup error:", eventsError);
                    showMessage(`Error loading events: ${eventsError.message}`, "error");
                    updateStatus("Disconnected");
                    return;
                }

                // Calculate stats — total from moments table, breakdown from usage_events
                const totalMoments = moments.length;
                const momentEvents = events.filter(e => e.event_type === "moment_created");
                const voiceMoments = momentEvents.filter(e => e.moment_type === "voice").length;
                const textMoments = momentEvents.filter(e => e.moment_type === "text").length;
                const sessionEvents = events.filter(e => e.event_type === "app_opened");

                // Update display
                document.getElementById("totalMoments").textContent = totalMoments;
                document.getElementById("momentDetail").textContent = `${voiceMoments} voice, ${textMoments} text`;
                document.getElementById("voiceMoments").textContent = voiceMoments;
                document.getElementById("textMoments").textContent = textMoments;
                document.getElementById("sessions").textContent = sessionEvents.length;

                // Display events
                const relevantEvents = events.filter(e => e.event_type === "moment_created" || e.event_type === "app_opened");
                const eventsList = document.getElementById("eventsList");

                if (relevantEvents.length === 0) {
                    eventsList.innerHTML = '<div class="empty-state">No moments or sessions yet.</div>';
                } else {
                    eventsList.innerHTML = relevantEvents.map(event => {
                        const timestamp = new Date(event.timestamp);
                        const timeStr = timestamp.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit', second: '2-digit', hour12: true });
                        const dateStr = timestamp.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
                        let eventLabel = event.event_type
                            .replace(/_/g, " ")
                            .replace(/\b\w/g, l => l.toUpperCase());

                        let momentType = "";
                        if (event.moment_type) {
                            momentType = `<span class="event-moment-type">(${event.moment_type})</span>`;
                        }

                        return `
                            <div class="event">
                                <div>
                                    <span class="event-type ${event.event_type}">${eventLabel}</span>${momentType}
                                </div>
                                <div class="event-timestamp">${dateStr} ${timeStr}</div>
                            </div>
                        `;
                    }).join("");
                }

                if (totalMoments === 0 && sessionEvents.length === 0) {
                    showMessage(`No moments or sessions yet for ${email}. Create moments in the app!`, "");
                } else {
                    const summary = `✅ ${totalMoments} moments (${voiceMoments}V/${textMoments}T) + ${sessionEvents.length} sessions`;
                    showMessage(summary, "success");
                }
                updateStatus("Connected");
                document.getElementById("lastUpdated").textContent = "Updated " + new Date().toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit', hour12: true });
            } catch (error) {
                console.error("Error:", error);
                showMessage(`Error: ${error.message}`, "error");
                updateStatus("Disconnected");
            }
        };

        function showMessage(text, type) {
            const messageEl = document.getElementById("message");
            messageEl.textContent = text;
            messageEl.className = type ? "message " + type : "message";
            if (text) {
                setTimeout(() => {
                    messageEl.textContent = "";
                    messageEl.className = "";
                }, 5000);
            }
        }

        function updateStatus(text) {
            const statusEl = document.getElementById("status");
            statusEl.textContent = text;
            statusEl.className = "status " + (text === "Connected" ? "connected" : "");
        }

        // Auto-load on page load, then refresh every 15 seconds
        window.addEventListener("load", () => {
            window.loadAnalytics();
            setInterval(() => {
                const email = document.getElementById("userEmail").value.toLowerCase().trim();
                if (email) window.loadAnalytics();
            }, 15000);
        });
    </script>
</body>
</html>
