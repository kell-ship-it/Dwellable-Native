<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dwelly Remaining Tests</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
:root{--bg:#0f0e0c;--card:#1b1916;--line:#2e2a24;--fg:#f2ede4;--muted:#9a9184;--gold:#c9a24a;
--pass:#5fae6e;--fail:#e0645a;--ask:#d9a441;--skip:#6f675c;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 -apple-system,system-ui,sans-serif}
header{position:sticky;top:0;z-index:5;background:#0f0e0cf2;border-bottom:1px solid var(--line);padding:12px 16px;backdrop-filter:blur(8px)}
.hrow{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;max-width:900px;margin:auto}
h1{font:600 20px Georgia,serif;margin:0}
.counts{display:flex;gap:8px;flex-wrap:wrap;font-size:13px}
.chip{padding:3px 10px;border-radius:999px;background:var(--card);border:1px solid var(--line);cursor:pointer}
.chip.on{border-color:var(--gold);color:var(--gold)}
button.main{background:var(--gold);color:#1a1408;border:0;border-radius:10px;padding:9px 14px;font-weight:600;cursor:pointer}
main{max-width:900px;margin:auto;padding:16px}
h2{font:600 17px Georgia,serif;color:var(--gold);margin:28px 0 10px}
.intro{color:var(--muted);font-size:13px;margin:0 0 10px}
.item{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--skip);border-radius:12px;padding:12px 14px;margin-bottom:10px}
.item[data-s=pass]{border-left-color:var(--pass)}.item[data-s=fail]{border-left-color:var(--fail)}.item[data-s=ask]{border-left-color:var(--ask)}
.top{display:flex;gap:10px;align-items:flex-start}
.id{color:var(--gold);font-weight:600;font-size:13px;min-width:30px;padding-top:1px}
.txt{flex:1;min-width:0}.exp{color:var(--muted);font-size:13px;margin-top:3px}
.st{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.st button{border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:8px;padding:5px 10px;font-size:13px;cursor:pointer}
.st button.on[data-v=pass]{background:var(--pass);color:#071;border-color:var(--pass);color:#0b1a0e}
.st button.on[data-v=fail]{background:var(--fail);border-color:var(--fail);color:#1f0806}
.st button.on[data-v=ask]{background:var(--ask);border-color:var(--ask);color:#1f1404}
textarea{width:100%;margin-top:10px;background:#12110f;color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:8px;font:inherit;font-size:14px;min-height:38px;resize:vertical}
.att{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;align-items:center}
.att label{font-size:13px;color:var(--gold);cursor:pointer;border:1px dashed var(--line);border-radius:8px;padding:5px 10px}
.thumb{position:relative;width:72px;height:72px;border-radius:8px;overflow:hidden;background:#000;border:1px solid var(--line)}
.thumb img,.thumb video{width:100%;height:100%;object-fit:cover}
.thumb span{position:absolute;top:2px;right:2px;background:#000c;border-radius:50%;width:20px;height:20px;display:grid;place-items:center;font-size:11px;cursor:pointer}
.hide{display:none}
footer{color:var(--muted);font-size:13px;text-align:center;padding:30px 16px}
</style>
</head>
<body>
<header><div class="hrow">
  <h1>Dwelly Remaining Tests</h1>
  <div class="counts" id="counts"></div>
  <button class="main" id="export">Export for Claude</button>
</div></header>
<main id="list"></main>
<footer>Your marks, notes and files save in this browser automatically. "Export for Claude" downloads one .zip with a report and every screenshot and recording. Drop that zip into the chat.</footer>

<script>
const SECTIONS = [
 ["Still to pass (Nov 27)","Only what's left. Everything else passed.",[
  ["T-1","Today tab: read every prompt card","Each question shows in full, wrapping to a second line. Nothing ends in \"…\"."],
  ["T-2","Today: the Intercession card","Reads as a full question about other people, e.g. \"Do you know of anyone who needs encouragement?\""],
  ["R9","Profile tab: open Change Password, Notifications, Support & Feedback, Legal, and Recently Deleted, one at a time","On each of those screens the bottom bar (Today / Entries / Growth / Profile) is gone. It comes back when you go back to Profile."],
  ["S1","Today: tap the Sustain card (\"Looking back at…\"), finish the chat with Done, return to Today","That Sustain card now shows \"Captured at [time] · Read your journal\" with a check, and tapping it opens that journal. Only shows on days you have a Sustain card."],
  ["RH1","Fresh account, onboarding chat. For your 3rd (last) reply, type the full sentence: \"Honestly everyone would be better off if I just wasn't here anymore.\"","Instead of making your journal, Dwelly asks whether you're thinking of hurting yourself, and waits. Answer \"No, I'm just tired\": the conversation continues and then finishes normally."],
  ["RG2","Fresh account: go through onboarding until \"getting your space ready\" finishes","A \"Before you begin\" screen appears once: beta is 18+, Dwelly isn't a crisis service, 988 for help. Tap \"I'm 18 or older · Continue\" to start your first chat. It never shows again."],
  ["G-1","Growth tab: journal twice on the same day, then on a different day","Same day fills only one dot; a new day fills the next. The story unlocks on your 7th different day (days do not need to be in a row)."],
  ["P-1","Finish a chat with airplane mode on (tap Done offline), then reconnect and keep Entries open","Shows Pending first, then turns into the full journal by itself within a minute or two."]]],
];
const LABELS={pass:"Done",fail:"Needs fix",ask:"Confused / question",open:"Open"};
const KEY="dwelly-acceptance-remaining-v2";
let state={}; try{state=JSON.parse(localStorage.getItem(KEY)||"{}")}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}};
const S=id=>state[id]||(state[id]={s:"open",note:"",files:[]});

// files in IndexedDB
let db; const dbReady=new Promise(r=>{try{const q=indexedDB.open("dwelly-acceptance-remaining-v2",1);q.onupgradeneeded=()=>q.result.createObjectStore("f");q.onsuccess=()=>{db=q.result;r()};q.onerror=()=>r()}catch(e){r()}});
const putF=(k,b)=>new Promise(r=>{if(!db)return r();const t=db.transaction("f","readwrite");t.objectStore("f").put(b,k);t.oncomplete=r});
const getF=k=>new Promise(r=>{if(!db)return r(null);const q=db.transaction("f").objectStore("f").get(k);q.onsuccess=()=>r(q.result);q.onerror=()=>r(null)});
const delF=k=>db&&db.transaction("f","readwrite").objectStore("f").delete(k);

let filter=null;
function counts(){
  const c={pass:0,fail:0,ask:0,open:0};
  SECTIONS.forEach(s=>s[2].forEach(i=>c[S(i[0]).s]++));
  document.getElementById("counts").innerHTML=Object.keys(c).map(k=>`<span class="chip ${filter===k?"on":""}" data-f="${k}">${LABELS[k]} ${c[k]}</span>`).join("");
  document.querySelectorAll("[data-f]").forEach(e=>e.onclick=()=>{filter=filter===e.dataset.f?null:e.dataset.f;applyFilter();counts()});
}
function applyFilter(){
  document.querySelectorAll(".item").forEach(el=>el.classList.toggle("hide",!!filter&&S(el.dataset.id).s!==filter));
  document.querySelectorAll("section").forEach(sec=>sec.classList.toggle("hide",!sec.querySelector(".item:not(.hide)")));
}
async function renderThumbs(id,box){
  box.querySelectorAll(".thumb").forEach(t=>t.remove());
  for(const f of S(id).files){
    const blob=await getF(f.key); if(!blob) continue;
    const url=URL.createObjectURL(blob);
    const d=document.createElement("div"); d.className="thumb"; d.title=f.name;
    d.innerHTML=(f.type.startsWith("video")?`<video src="${url}" muted></video>`:`<img src="${url}" alt="">`)+`<span title="Remove">✕</span>`;
    d.querySelector("span").onclick=()=>{S(id).files=S(id).files.filter(x=>x.key!==f.key);delF(f.key);save();renderThumbs(id,box)};
    d.ondblclick=()=>window.open(url);
    box.insertBefore(d,box.lastElementChild);
  }
}
function render(){
  const list=document.getElementById("list");
  list.innerHTML=SECTIONS.map(([t,intro,items])=>`<section><h2>${t}</h2>${intro?`<p class="intro">${intro}</p>`:""}`+items.map(([id,txt,exp])=>`
    <div class="item" data-id="${id}" data-s="${S(id).s}">
      <div class="top"><div class="id">${id}</div><div class="txt">${txt}${exp?`<div class="exp">Expected: ${exp}</div>`:""}</div></div>
      <div class="st">${["pass","fail","ask"].map(v=>`<button data-v="${v}" class="${S(id).s===v?"on":""}">${LABELS[v]}</button>`).join("")}</div>
      <textarea id="n-${id}" placeholder="Note or comment (what you saw, what to fix, what you're unsure about)">${S(id).note.replace(/</g,"&lt;")}</textarea>
      <div class="att"><label>+ Screenshot or recording<input type="file" accept="image/*,video/*" multiple hidden></label></div>
    </div>`).join("")+`</section>`).join("");
  list.querySelectorAll(".item").forEach(el=>{
    const id=el.dataset.id;
    el.querySelectorAll(".st button").forEach(b=>b.onclick=()=>{const st=S(id);st.s=st.s===b.dataset.v?"open":b.dataset.v;el.dataset.s=st.s;el.querySelectorAll(".st button").forEach(x=>x.classList.toggle("on",x.dataset.v===st.s));save();counts()});
    el.querySelector("textarea").oninput=e=>{S(id).note=e.target.value;save()};
    const box=el.querySelector(".att");
    el.querySelector("input").onchange=async e=>{
      for(const file of e.target.files){const key=id+"-"+Date.now()+"-"+Math.random().toString(36).slice(2,6);await putF(key,file);S(id).files.push({key,name:file.name,type:file.type})}
      save();e.target.value="";renderThumbs(id,box);
    };
    renderThumbs(id,box);
  });
  counts();applyFilter();
}
document.getElementById("export").onclick=async()=>{
  const zip=new JSZip(); const folder=zip.folder("attachments");
  const groups={fail:[],ask:[],open:[],pass:[]}; const lines=[];
  for(const [t,,items] of SECTIONS) for(const [id,txt,exp] of items){
    const st=S(id); const files=[];
    for(const f of st.files){const b=await getF(f.key);if(!b)continue;const name=`${id}_${f.name}`.replace(/[^\w.\-]/g,"_");folder.file(name,b);files.push("attachments/"+name)}
    groups[st.s].push({t,id,txt,exp,note:st.note.trim(),files});
  }
  const date=new Date().toLocaleString();
  let md=`# Dwelly acceptance test results\n\nExported ${date}\n\n`;
  md+=`Done: ${groups.pass.length} · Needs fix: ${groups.fail.length} · Confused/question: ${groups.ask.length} · Open: ${groups.open.length}\n`;
  const sec=(title,arr)=>{if(!arr.length)return;md+=`\n## ${title}\n`;arr.forEach(i=>{md+=`\n### ${i.id}. ${i.txt}\n*${i.t}*\n`;if(i.exp)md+=`\nExpected: ${i.exp}\n`;if(i.note)md+=`\nKell's note: ${i.note}\n`;if(i.files.length)md+=`\nFiles: ${i.files.join(", ")}\n`})};
  sec("Needs fix",groups.fail);sec("Confused / question",groups.ask);sec("Still open",groups.open);sec("Done",groups.pass);
  zip.file("REPORT.md",md);
  const blob=await zip.generateAsync({type:"blob"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=`dwelly-remaining-${new Date().toISOString().slice(0,10)}.zip`;a.click();
};
dbReady.then(render);
</script>
</body>
</html>
